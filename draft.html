<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Multi-Player FIFA World Cup Draft</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #f1f5f9 0%, #e9eef3 100%); }
        .scrollable-list { max-height: 55vh; overflow-y: auto; }
        .badge-pos { border-radius: 40px; font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.7rem; }
        .btn-action:active { transform: scale(0.96); }
        .user-badge { transition: all 0.2s ease; }
        .user-badge:hover { transform: translateY(-2px); }
        .draft-notification { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="antialiased">

<!-- Login Modal -->
<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 shadow-2xl">
        <div class="text-center mb-6">
            <div class="bg-gradient-to-br from-green-700 to-emerald-800 text-white p-4 rounded-2xl inline-block mb-4">
                <i class="fas fa-futbol text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Multi-Player Draft</h2>
            <p class="text-gray-500 text-sm mt-2">Join or create a draft room</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                <input type="text" id="username" placeholder="Enter your name" 
                    class="w-full border rounded-xl p-2 focus:ring-2 focus:ring-emerald-300">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Room Code</label>
                <input type="text" id="roomCode" placeholder="Enter room code (or leave blank for new room)" 
                    class="w-full border rounded-xl p-2 focus:ring-2 focus:ring-emerald-300">
            </div>
            
            <button id="joinRoomBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl font-medium transition">
                Join / Create Room
            </button>
        </div>
    </div>
</div>

<!-- Main App (hidden until login) -->
<div id="mainApp" class="max-w-7xl mx-auto px-4 py-5 md:py-7 hidden">
    <!-- Header -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-br from-green-700 to-emerald-800 text-white p-3 rounded-2xl shadow-md">
                <i class="fas fa-users text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-gray-800">🎯 Live Multi-Player Draft</h1>
                <p class="text-gray-500 text-sm">Room: <span id="roomDisplay" class="font-mono font-bold"></span></p>
            </div>
        </div>
        <div class="flex gap-2 flex-wrap">
            <div class="bg-white/80 backdrop-blur-sm rounded-full px-4 py-2 shadow-sm text-sm font-medium">
                <i class="fas fa-user-friends text-emerald-600 mr-1"></i> <span id="userCount">1</span> online
            </div>
            <div class="bg-white/80 backdrop-blur-sm rounded-full px-4 py-2 shadow-sm text-sm font-medium">
                <i class="fas fa-users text-emerald-600 mr-1"></i> <span id="draftedCount">0</span> drafted
            </div>
            <div class="bg-white/80 backdrop-blur-sm rounded-full px-4 py-2 shadow-sm text-sm font-medium">
                <i class="fas fa-user-plus text-blue-600 mr-1"></i> <span id="availableCount">0</span> available
            </div>
        </div>
    </div>

    <!-- Users Online -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-4 mb-6">
        <h3 class="font-semibold text-gray-700 mb-2"><i class="fas fa-users"></i> Players in Room</h3>
        <div id="usersList" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- Team Selection -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-200 p-5 mb-6">
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
            <div class="flex items-center gap-2">
                <i class="fas fa-flag-checkered text-indigo-500 text-xl"></i>
                <h3 class="font-semibold text-gray-700">Select Team Pool</h3>
            </div>
            <button id="resetDraftBtn" class="text-sm bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1.5 rounded-full transition">
                <i class="fas fa-trash-alt mr-1"></i> Reset Draft (All Players)
            </button>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
            <button data-team="czech" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇨🇿 Czech Republic</button>
            <button data-team="mexico" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇲🇽 Mexico</button>
            <button data-team="brazil" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇧🇷 Brazil</button>
            <button data-team="paraguay" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇵🇾 Paraguay</button>
            <button data-team="sweden" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇸🇪 Sweden</button>
            <button data-team="argentina" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇦🇷 Argentina</button>
            <button data-team="uzbekistan" class="team-btn bg-gray-100 hover:bg-indigo-100 p-2 rounded-xl text-sm font-medium transition">🇺🇿 Uzbekistan</button>
            <button data-team="all" class="team-btn bg-indigo-600 text-white hover:bg-indigo-700 p-2 rounded-xl text-sm font-medium transition">🌍 All Teams</button>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- Available Players -->
        <div class="lg:w-1/2 bg-white rounded-2xl shadow-lg border border-gray-100 flex flex-col overflow-hidden">
            <div class="p-5 border-b bg-gray-50">
                <h2 class="text-xl font-bold text-gray-800 mb-3"><i class="fas fa-database text-emerald-600"></i> Available Players</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="searchInput" placeholder="🔍 Search players..." class="px-3 py-2 border rounded-xl text-sm">
                    <select id="positionFilter" class="px-3 py-2 border rounded-xl text-sm bg-white">
                        <option value="all">All positions</option>
                        <option value="Goalkeeper">🧤 Goalkeeper</option>
                        <option value="Defender">🛡️ Defender</option>
                        <option value="Midfielder">🎯 Midfielder</option>
                        <option value="Forward">⚽ Forward</option>
                    </select>
                </div>
            </div>
            <div id="availableContainer" class="scrollable-list p-4 grid grid-cols-1 gap-3">
                <div class="text-center py-12 text-gray-400">Loading players...</div>
            </div>
        </div>

        <!-- Draft Board -->
        <div class="lg:w-1/2 bg-white rounded-2xl shadow-lg border border-gray-100 flex flex-col">
            <div class="p-5 border-b bg-gray-50">
                <div class="flex flex-wrap justify-between items-center gap-3">
                    <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-clipboard-list text-indigo-600"></i> Draft Board</h2>
                    <div class="flex gap-2">
                        <button id="randomPickBtn" class="bg-purple-100 hover:bg-purple-200 text-purple-800 px-3 py-1.5 rounded-xl text-sm">
                            <i class="fas fa-dice-d6"></i> Random Pick
                        </button>
                    </div>
                </div>
                <div class="text-xs text-gray-500 mt-2">Players drafted in order</div>
            </div>
            <div id="draftedContainer" class="scrollable-list p-4 space-y-2.5">
                <div class="text-center py-12 text-gray-400">No picks yet — start drafting!</div>
            </div>
        </div>
    </div>
    
    <!-- Notifications -->
    <div id="notifications" class="fixed bottom-4 right-4 z-50 space-y-2"></div>
</div>

<script>
    let socket = null;
    let currentRoom = null;
    let currentUsername = null;
    let allPlayers = [];
    let draftedIds = [];
    let searchTerm = "";
    let positionTerm = "all";
    
    // Position colors
    function getPosColor(pos) {
        const colors = {
            'Goalkeeper': 'bg-amber-100 text-amber-700',
            'Defender': 'bg-purple-100 text-purple-700',
            'Midfielder': 'bg-blue-100 text-blue-700',
            'Forward': 'bg-green-100 text-green-700'
        };
        return colors[pos] || 'bg-gray-100 text-gray-600';
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function showNotification(message, type = 'info') {
        const colors = {
            'success': 'bg-green-500',
            'error': 'bg-red-500',
            'info': 'bg-blue-500',
            'warning': 'bg-yellow-500'
        };
        
        const notification = document.createElement('div');
        notification.className = `${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg draft-notification text-sm`;
        notification.innerHTML = message;
        
        const container = document.getElementById('notifications');
        container.appendChild(notification);
        
        setTimeout(() => {
            notification.remove();
        }, 3000);
    }
    
    function refreshUI() {
        // Filter available players
        let available = allPlayers.filter(p => !draftedIds.includes(p.id));
        available = available.filter(p => {
            const matchSearch = searchTerm === "" || 
                p.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                p.team.toLowerCase().includes(searchTerm.toLowerCase()) ||
                p.club.toLowerCase().includes(searchTerm.toLowerCase());
            const matchPos = positionTerm === "all" || p.position === positionTerm;
            return matchSearch && matchPos;
        });
        
        // Render available players
        const availableContainer = document.getElementById("availableContainer");
        if (available.length === 0) {
            availableContainer.innerHTML = `<div class="text-center py-12 text-gray-400">No available players</div>`;
        } else {
            availableContainer.innerHTML = available.map(player => `
                <div class="bg-gray-50 rounded-xl p-3 border border-gray-200 hover:shadow-md transition flex justify-between items-center">
                    <div class="flex-1">
                        <div class="font-bold text-gray-800 text-sm flex items-center gap-2 flex-wrap">
                            ${escapeHtml(player.name)} 
                            <span class="badge-pos ${getPosColor(player.position)}">${player.position}</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1">
                            ${player.teamFlag} ${escapeHtml(player.team)} · ${escapeHtml(player.club)}
                        </div>
                    </div>
                    <button onclick="draftPlayer('${player.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white rounded-full w-8 h-8 flex items-center justify-center shadow-sm">
                        <i class="fas fa-plus text-xs"></i>
                    </button>
                </div>
            `).join('');
        }
        
        // Render drafted players
        const draftedContainer = document.getElementById("draftedContainer");
        const draftedPlayers = draftedIds.map(id => allPlayers.find(p => p.id === id)).filter(p => p);
        
        if (draftedPlayers.length === 0) {
            draftedContainer.innerHTML = `<div class="text-center py-12 text-gray-400">No picks yet — start drafting!</div>`;
        } else {
            draftedContainer.innerHTML = draftedPlayers.map((player, idx) => `
                <div class="bg-indigo-50/40 border border-indigo-100 rounded-xl p-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <span class="bg-indigo-200 text-indigo-800 rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold">${idx+1}</span>
                        <div>
                            <div class="font-semibold text-gray-800">${escapeHtml(player.name)}</div>
                            <div class="text-xs text-gray-500">${player.position} · ${player.teamFlag} ${escapeHtml(player.team)}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        document.getElementById("draftedCount").innerText = draftedIds.length;
        document.getElementById("availableCount").innerText = allPlayers.length - draftedIds.length;
    }
    
    // Socket event handlers
    function draftPlayer(playerId) {
        if (socket && currentRoom) {
            socket.emit('draft_player', {
                room: currentRoom,
                player_id: playerId,
                username: currentUsername
            });
        }
    }
    
    // Join room
    document.getElementById("joinRoomBtn").addEventListener("click", () => {
        const username = document.getElementById("username").value.trim();
        let roomCode = document.getElementById("roomCode").value.trim().toUpperCase();
        
        if (!username) {
            alert("Please enter your name");
            return;
        }
        
        if (!roomCode) {
            roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        
        currentUsername = username;
        currentRoom = roomCode;
        
        // Connect to socket
        socket = io();
        
        socket.on('connect', () => {
            socket.emit('join_room', {
                room: currentRoom,
                username: currentUsername
            });
        });
        
        socket.on('room_state', (data) => {
            allPlayers = data.players;
            draftedIds = data.drafted_ids;
            document.getElementById("roomDisplay").innerText = currentRoom;
            refreshUI();
            document.getElementById("loginModal").classList.add("hidden");
            document.getElementById("mainApp").classList.remove("hidden");
            showNotification(`Connected to room ${currentRoom}`, 'success');
        });
        
        socket.on('users_update', (data) => {
            const usersList = document.getElementById("usersList");
            usersList.innerHTML = data.users.map(user => `
                <span class="user-badge bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">
                    <i class="fas fa-user"></i> ${escapeHtml(user)}
                </span>
            `).join('');
            document.getElementById("userCount").innerText = data.users.length;
        });
        
        socket.on('player_drafted', (data) => {
            draftedIds = data.drafted_ids;
            refreshUI();
            showNotification(`${data.username} drafted a player!`, 'success');
        });
        
        socket.on('player_removed', (data) => {
            draftedIds = data.drafted_ids;
            refreshUI();
            showNotification(`${data.username} removed a player`, 'warning');
        });
        
        socket.on('draft_reset', (data) => {
            draftedIds = data.drafted_ids;
            refreshUI();
            showNotification(`${data.username} reset the draft!`, 'info');
        });
        
        socket.on('team_changed', (data) => {
            allPlayers = data.players;
            draftedIds = data.drafted_ids;
            refreshUI();
            showNotification(`Team pool changed!`, 'info');
        });
        
        socket.on('error', (data) => {
            showNotification(data.message, 'error');
        });
    });
    
    // Other event listeners
    document.getElementById("randomPickBtn").addEventListener("click", () => {
        if (socket && currentRoom) {
            socket.emit('random_pick', {
                room: currentRoom,
                username: currentUsername
            });
        }
    });
    
    document.getElementById("resetDraftBtn").addEventListener("click", () => {
        if (socket && currentRoom && confirm("Reset entire draft for everyone?")) {
            socket.emit('reset_draft', {
                room: currentRoom,
                username: currentUsername
            });
        }
    });
    
    document.querySelectorAll('.team-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (socket && currentRoom) {
                const team = btn.getAttribute('data-team');
                socket.emit('change_team', {
                    room: currentRoom,
                    team_key: team
                });
            }
        });
    });
    
    document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value;
        refreshUI();
    });
    
    document.getElementById("positionFilter").addEventListener("change", (e) => {
        positionTerm = e.target.value;
        refreshUI();
    });
    
    window.draftPlayer = draftPlayer;
    
    // Handle page close
    window.addEventListener('beforeunload', () => {
        if (socket && currentRoom) {
            socket.emit('leave_room', { room: currentRoom });
        }
    });
</script>
</body>
</html>
